services:
  redis-1:
    image: redis:latest
    container_name: redis-1  # 自定义容器名称
    restart: unless-stopped
    networks:
      - example
    command: >
      redis-server
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly no
    healthcheck:
      # 修复2：健康检查改对（端口6379，用redis-cli更可靠）
      test: ["CMD", "redis-cli", "PING"]  # 不用nc，直接用Redis自带命令
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s 

