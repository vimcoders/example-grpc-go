services:
  balance:
    build:
      dockerfile: cmd/balance/Dockerfile
    image: ${REGISTRY_URL}/balance:${IMAGE_ID}
    container_name: balance  # 自定义容器名称
    restart: always
    networks:
      - example  # 加入私有网络
    environment:
      MYSQL: ${MYSQL_DSN}
      ProxyService: Proxy:50051
      SocialService: Social:50052
      ChatService: Chat:50053
      ActivityService: Activity:50054
      ItemService: Item:50055
      MailService: Mail:50056
      GMService: GM:50057
      RedisService: ${Redis_Service}
      NatsService: ${Nats_Service}
      TLSPort: :46888
      TCPPort: :26888
      HTTPPort: :16888
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }
      mysql: { condition: service_healthy }  # 等待 mysql 健康后再启动
      nats-1: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-2: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-3: { condition: service_healthy } # 等待 nats 健康后再启动
    ports:
      - "16888:16888"
      - "26888:26888"
      - "46888:46888"

  proxy:
