    environment:
      MYSQL: ${MYSQL_DSN}
      Port: :50054
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }
      mysql: { condition: service_healthy }  # 等待 mysql 健康后再启动
      nats-1: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-2: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-3: { condition: service_healthy } # 等待 nats 健康后再启动

  item:
    build:
      dockerfile: cmd/item/Dockerfile
    image: ${REGISTRY_URL}/item:${IMAGE_ID}
    container_name: item  # 自定义容器名称
    restart: always
    networks:
      - example  # 加入私有网络
    environment:
      MYSQL: ${MYSQL_DSN}
      Port: :50055
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }
      mysql: { condition: service_healthy }  # 等待 mysql 健康后再启动
      nats-1: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-2: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-3: { condition: service_healthy } # 等待 nats 健康后再启动

  mail:
    build:
      dockerfile: cmd/mail/Dockerfile
    image: ${REGISTRY_URL}/mail:${IMAGE_ID}
    container_name: mail  # 自定义容器名称
    restart: always
    networks:
      - example  # 加入私有网络
    environment:
      MYSQL: ${MYSQL_DSN}
      Port: :50056
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }
      mysql: { condition: service_healthy }  # 等待 mysql 健康后再启动
      nats-1: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-2: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-3: { condition: service_healthy } # 等待 nats 健康后再启动

  gm:
    build:
      dockerfile: cmd/gm/Dockerfile
    image: ${REGISTRY_URL}/gm:${IMAGE_ID}
    container_name: gm  # 自定义容器名称
    restart: always
    networks:
      - example  # 加入私有网络
    environment:
      MYSQL: ${MYSQL_DSN}
      Port: :50057
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }
      mysql: { condition: service_healthy }  # 等待 mysql 健康后再启动
      nats-1: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-2: { condition: service_healthy } # 等待 nats 健康后再启动
      nats-3: { condition: service_healthy } # 等待 nats 健康后再启动

  mysql:
    image: mysql:latest
    container_name: mysql
    restart: always
    networks:
      - example  # 加入私有网络
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: 'root'
    # 健康检查配置：判断 MySQL 是否可连接
    healthcheck:
      # 测试命令：使用 mysqladmin  ping 检查连接
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s        # 每5秒检查一次
      timeout: 5s         # 单次检查超时时间
      retries: 10         # 最多重试10次（总计约50秒）
      start_period: 15s   # 启动后15秒内不检查（预留初始化时间）

  nats-1:
    image: nats:latest
    container_name: nats-1
    command:
      - "--name"
      - "nats-1"
      - "--cluster_name"
      - "nats-cluster"
      - "--cluster"
      - "nats://0.0.0.0:6222"
      - "--cluster_advertise"
      - "nats-1:6222"
      - "--routes"
      - "nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222"
      - "--http_port"
      - "8222"
      - "--port"
      - "4222"
    networks:
      - example
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nats-server", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nats-2:
    image: nats:latest
    container_name: nats-2
    command:
      - "--name"
      - "nats-2"
      - "--cluster_name"
      - "nats-cluster"
      - "--cluster"
      - "nats://0.0.0.0:6222"
      - "--cluster_advertise"
      - "nats-2:6222"
      - "--routes"
      - "nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222"
      - "--http_port"
      - "8222"
      - "--port"
      - "4222"
    networks:
      - example
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nats-server", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nats-3:
    image: nats:latest
    container_name: nats-3
    command:
      - "--name"
      - "nats-3"
      - "--cluster_name"
      - "nats-cluster"
      - "--cluster"
      - "nats://0.0.0.0:6222"
      - "--cluster_advertise"
      - "nats-3:6222"
      - "--routes"
      - "nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222"
      - "--http_port"
      - "8222"
      - "--port"
      - "4222"
    networks:
      - example
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nats-server", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s    
  redis-1:
    image: redis:latest
    container_name: redis-1  # 自定义容器名称
    restart: unless-stopped
    networks:
      - example
    command: >
      redis-server
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly no
    healthcheck:
      # 修复2：健康检查改对（端口6379，用redis-cli更可靠）
      test: ["CMD", "redis-cli", "PING"]  # 不用nc，直接用Redis自带命令
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s 
  redis-2:
    image: redis:latest
    container_name: redis-2  # 自定义容器名称
    restart: unless-stopped
    networks:
      - example
    command: >
      redis-server
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly no
    healthcheck:
      # 修复2：健康检查改对（端口6379，用redis-cli更可靠）
      test: ["CMD", "redis-cli", "PING"]  # 不用nc，直接用Redis自带命令
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s 
  redis-3:
    image: redis:latest
    container_name: redis-3  # 自定义容器名称
    restart: unless-stopped
    networks:
      - example
    command: >
      redis-server
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly no
    healthcheck:
      # 修复2：健康检查改对（端口6379，用redis-cli更可靠）
      test: ["CMD", "redis-cli", "PING"]  # 不用nc，直接用Redis自带命令
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s 
  redis-4:
    image: redis:latest
    container_name: redis-4  # 自定义容器名称
    restart: unless-stopped
    networks:
      - example
    command: >
      redis-server
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly no
    healthcheck:
      # 修复2：健康检查改对（端口6379，用redis-cli更可靠）
      test: ["CMD", "redis-cli", "PING"]  # 不用nc，直接用Redis自带命令
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s 
  redis-5:
    image: redis:latest
    container_name: redis-5  # 自定义容器名称
    restart: unless-stopped
    networks:
      - example
    command: >
      redis-server
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly no
    healthcheck:
      # 修复2：健康检查改对（端口6379，用redis-cli更可靠）
      test: ["CMD", "redis-cli", "PING"]  # 不用nc，直接用Redis自带命令
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s 
  redis-6:
    image: redis:latest
    container_name: redis-6  # 自定义容器名称
    restart: unless-stopped
    networks:
      - example
    command: >
      redis-server
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --appendonly no
    healthcheck:
      # 修复2：健康检查改对（端口6379，用redis-cli更可靠）
      test: ["CMD", "redis-cli", "PING"]  # 不用nc，直接用Redis自带命令
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s 
  redis-cluster-init:
    image: redis:latest
    container_name: redis-cluster-init
    networks:
      - example
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - |
        redis-cli -h redis-1 CLUSTER RESET HARD
        redis-cli -h redis-2 CLUSTER RESET HARD
        redis-cli -h redis-3 CLUSTER RESET HARD
        redis-cli -h redis-4 CLUSTER RESET HARD
        redis-cli -h redis-5 CLUSTER RESET HARD
        redis-cli -h redis-6 CLUSTER RESET HARD
        redis-cli --cluster create redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379 --cluster-replicas 1 --cluster-yes
    restart: "no"

  mysql-1:
    image: mysql:8.0.40
    container_name: mysql-1
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: Root@123456
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=1
      - --report-host=mysql-1
      - --log-bin=mysql-bin
      - --binlog_format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --sync_binlog=1
      - --transaction-write-set-extraction=XXHASH64
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-S", "/var/run/mysqld/mysqld.sock", "-uroot", "-pRoot@123456"]
      interval: 8s
      timeout: 5s
      retries: 8
    networks:
      - example

  mysql-2:
    image: mysql:8.0.40
    container_name: mysql-2
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: Root@123456
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=2
      - --report-host=mysql-2
      - --log-bin=mysql-bin
      - --binlog_format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --sync_binlog=1
      - --transaction-write-set-extraction=XXHASH64
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-S", "/var/run/mysqld/mysqld.sock", "-uroot", "-pRoot@123456"]
      interval: 8s
      timeout: 5s
      retries: 8
    networks:
      - example

  mysql-3:
    image: mysql:8.0.40
    container_name: mysql-3
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: Root@123456
      MYSQL_ROOT_HOST: "%"
    command:
      - --server-id=3
      - --report-host=mysql-3
      - --log-bin=mysql-bin
      - --binlog_format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --sync_binlog=1
      - --transaction-write-set-extraction=XXHASH64
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-S", "/var/run/mysqld/mysqld.sock", "-uroot", "-pRoot@123456"]
      interval: 8s
      timeout: 5s
      retries: 8
    networks:
      - example

  # MySQL Router：应用接入层
  mysql-router:
    image: mysql/mysql-router:latest
    container_name: mysql-router
    restart: unless-stopped
    depends_on:
      mysql-1:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql-1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: Root@123456
    ports:
      - "6446:6446"   # RW读写端口，自动路由主节点
      - "6447:6447"   # RO只读端口，负载均衡至副本
    networks:
      - example

  mysql-cluster-init:
    image: mysql:8.0.40
    container_name: mysql-cluster-init
    depends_on:
      mysql-1:
        condition: service_healthy
      mysql-2:
        condition: service_healthy
      mysql-3:
        condition: service_healthy
    volumes:
      - ./bootstrap.js:/bootstrap.js:ro
    command: bash -c "set -euo pipefail; mysqlsh root@mysql-1:3306 -pRoot@123456 --js -f /bootstrap.js"
    restart: "no"
    networks:
      - example

  mongo-1:
    image: mongo:latest
    container_name: mongo-1
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    networks:
      - example

  mongo-2:
    image: mongo:latest
    container_name: mongo-2
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    networks:
      - example

  mongo-3:
    image: mongo:latest
    container_name: mongo-3
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    networks:
      - example

  mongo-cluster-init:
    image: mongo:latest
    container_name: mongo-cluster-init
    depends_on:
      - mongo-1
      - mongo-2
      - mongo-3
    volumes:
      - ./mongo-cluster.sh:/mongo-cluster.sh
    command: bash /mongo-cluster.sh
    networks:
      - example

networks:
  example:
    driver: bridge  # 使用桥接驱动，默认选项